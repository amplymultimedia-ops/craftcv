services:
  - type: web
    name: craftcv-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: release-candidate-local-ai
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: openai
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false